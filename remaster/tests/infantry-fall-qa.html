<!doctype html><meta charset="utf-8"><title>Backward infantry fall check</title><style>body{background:#18251f;color:#eee;font:16px sans-serif}#grid{display:grid;grid-template-columns:repeat(4,270px);gap:10px}figure{margin:0}canvas{width:270px;height:170px;background:#907e59}</style><h1>Backward falls · base is left, impact pushes right</h1><div id="grid"></div><script type="module">
import {loadAssets} from '../src/assets.js';import {Renderer} from '../src/renderer.js';import {simToDesign,DEATH_MS} from '../src/combat.js';
const assets=await loadAssets();for(const name of ['SoldatAK','SoldatBazooka'])for(const progress of [0,.3,.6,.9]){const fig=document.createElement('figure');fig.innerHTML=`<figcaption>${name} · ${Math.round(progress*350)} ms</figcaption>`;const canvas=document.createElement('canvas');canvas.width=540;canvas.height=340;fig.append(canvas);document.querySelector('#grid').append(fig);const r=new Renderer(canvas,{view:{scale:2,dpr:1}});r.setAssets(assets);const e={name,id:1,x:300,y:220,ttl:DEATH_MS*(1-progress),health:0,healthMax:100,state:'attack'},p=simToDesign(e),c=r.ctx;c.translate(210-p.x*4,280-p.y*4);c.scale(4,4);c.strokeStyle='#d6c797';c.lineWidth=.25;c.beginPath();c.moveTo(p.x-60,p.y+1);c.lineTo(p.x+60,p.y+1);c.stroke();r.soldier(c,e,0,true,1000);}
</script>
